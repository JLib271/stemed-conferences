name: Correct a listing or add new dates
description: New dates, a deadline, a link, travel support, or another detail that is wrong or out of date.
title: "Update: "
labels: ["update conference"]
body:
  - type: input
    id: listing
    attributes: {label: "Which meeting?", description: "Meeting name, or the file in conferences/ if you know it."}
    validations: {required: true}
  - type: textarea
    id: change
    attributes: {label: "What should change?", description: "For new dates, include the city, venue, and any deadlines."}
    validations: {required: true}
  - type: input
    id: source
    attributes: {label: "Where did you see the correct information?", description: "Ideally a link to the sponsor's or meeting's page."}
