name: NSF ATE Principal Investigators' Conference
short: ATE PI
sponsors: [American Association of Community Colleges, National Science Foundation]
sponsor_type: US federal agency
funding_note: Hosted by the American Association of Community Colleges with support from NSF's Advanced Technological Education (ATE) program.
kind: education
url: https://atecentral.net/
frequency: annual
schedule: Every October in Washington, DC; session proposals are usually due in August. 2027 dates are not yet announced.
travel_support: AACC gives each active ATE award two free registrations, each with three hotel nights.
summary: The yearly meeting of NSF ATE grantees, on community college technician education in fields such as advanced manufacturing, biotechnology, and cybersecurity. Registration is mainly for ATE project teams and partners.
